global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: /metrics
  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:4001']
    metrics_path: /metrics
  - job_name: ledger-service
    static_configs:
      - targets: ['ledger-service:4002']
    metrics_path: /metrics
  - job_name: payments-service
    static_configs:
      - targets: ['payments-service:4003']
    metrics_path: /metrics
  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:4004']
    metrics_path: /metrics
  - job_name: fraud-audit-service
    static_configs:
      - targets: ['fraud-audit-service:4005']
    metrics_path: /metrics
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
